name: Build Android APKs

# Builds release APKs for all six Flutter apps in this repo. GitHub-hosted
# runners have unrestricted network access (and a preinstalled Android SDK),
# which some Claude Code sessions in this environment do not, so this is the
# reliable way to get a fresh APK for each app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  # Backend quality gate (P1-12) — runs BEFORE any APK is built or released:
  # the full pytest suite plus a dependency vulnerability audit. If either
  # fails, the build/release jobs never start, so a red backend can't ship
  # silently inside new APKs.
  backend-tests:
    name: Backend tests & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend requirements
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite (SQLite mode)
        # DATABASE_URL is never set on runners — explicit -u guarantees the
        # suite can't accidentally touch a real database.
        run: env -u DATABASE_URL python -m pytest -q

      - name: Dependency vulnerability audit (pip-audit)
        # resolves requirements.txt in an isolated env and checks every
        # pinned/floor version against the OSV database; --strict fails on
        # any finding (including unfixed ones, reported as errors)
        run: pip-audit -r requirements.txt --strict

  # Flutter quality gate (P2-11) — runs BEFORE any APK is built or released:
  # flutter pub get, flutter analyze, and flutter test across the three native Flutter apps.
  # Also generates and archives pubspec.lock files as artifacts for inspection.
  flutter-tests:
    name: Flutter test & analyze (${{ matrix.app }})
    needs: backend-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - careplus_flutter
          - careplus_partner
          - careplus_admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: flutter pub get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      # Info-level lints stay visible in the log but don't fail the build;
      # errors and warnings still do. Lint cleanup is tracked as follow-up.
      - name: flutter analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        working-directory: ${{ matrix.app }}
        run: flutter test

      - name: Upload pubspec.lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-pubspec-lock
          path: ${{ matrix.app }}/pubspec.lock
          retention-days: 30

  build:
    name: Build ${{ matrix.app }}
    needs: [backend-tests, flutter-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - careplus_flutter
          - careplus_partner
          - careplus_admin
          - rasoi_web_customer
          - rasoi_web_partner
          - rasoi_web_admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: flutter pub get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    name: Publish APK release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-apk"
          path: apks

      - name: Flatten and rename APKs
        run: |
          mkdir -p release
          for dir in apks/*-apk; do
            app="$(basename "$dir" -apk)"
            apk="$(find "$dir" -name '*.apk' | head -n1)"
            cp "$apk" "release/${app}.apk"
          done
          ls -la release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apks-${{ github.run_number }}" release/*.apk \
            --repo "${{ github.repository }}" \
            --title "APK build #${{ github.run_number }}" \
            --notes "Automated release APK build from commit ${{ github.sha }}."
