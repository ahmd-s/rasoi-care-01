name: care_plus
description: "Care+ — expert care for the heart of your home."
publish_to: "none"
version: 0.1.0+1

# Built and tested against Flutter 3.27+ (Dart 3.6+). The theme uses
# Color.withValues(...) and the *ThemeData component classes (CardThemeData,
# DialogThemeData) that landed in 3.27 — on an older SDK, run `flutter upgrade`.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1     # MVVM state, per the build spec
  go_router: ^14.6.2           # declarative routes + role/auth redirect
  google_fonts: ^6.2.1         # Fraunces · Plus Jakarta Sans · IBM Plex Mono
  intl: ^0.20.2                # ₹ formatting via en_IN, pinned by flutter_localizations
  http: ^1.2.2                 # REST calls to the Flask+SQLite backend — see lib/data/api

  firebase_core: ^3.8.0        # wired in — see lib/data/firebase/README or app §Firebase Auth
  firebase_auth: ^5.3.4        # phone/email/Google sign-in, guarded fallback to mock if unconfigured
  google_sign_in: ^6.2.2       # Google auth provider — see lib/data/firebase/firebase_auth_service.dart
  cloud_firestore: ^5.6.0      # user profile write-through on registration — see README §5b

  google_maps_flutter: ^2.10.0 # address picker + live tracking map — gated behind
                                # MapsConfig.isConfigured, see lib/core/config/maps_config.dart
  geolocator: ^13.0.2           # "use my current location" in the address picker
  smart_auth: ^3.2.0
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0           # fingerprint/face unlock, offered after sign-up — see BiometricService
  image_picker: ^1.2.3         # profile photo upload — see AccountScreen
  firebase_storage: ^12.3.7    # profile photo upload — see UserProfileService
  razorpay_flutter: ^1.3.7     # Razorpay checkout; order/signature verification stays server-side
  flutter_localizations:
    sdk: flutter               # real English/Hindi/Marathi UI — see lib/l10n and Account > Language

  # --- Wire these in when you move the rest off mock data (see README §5) ---
  # firebase_messaging: ^15.1.6
  # drift: ^2.22.1              # offline outbox for the technician app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  # Bundled so google_fonts resolves these without a network fetch (tests run
  # with allowRuntimeFetching = false). Names must match google_fonts'
  # "<Family>-<Weight>.ttf" convention; add a file per weight the theme uses.
  assets:
    - assets/google_fonts/
    - assets/brand/
